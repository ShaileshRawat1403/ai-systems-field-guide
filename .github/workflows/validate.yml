name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check content shape
        run: npm run validate
      - name: Check the built page is up to date
        run: |
          npm run build
          git diff --exit-code site/public || (echo "Run npm run build and commit site/public" && exit 1)
